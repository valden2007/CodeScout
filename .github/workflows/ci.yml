name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} · Node 20
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extension/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install extension dependencies
        run: npm ci --prefix extension

      - name: Lint
        shell: bash
        run: |
          if node -e "process.exit((require('./package.json').scripts||{}).lint?0:1)"; then
            npm run lint -- --max-warnings=0
          else
            echo "npm run lint не настроен — шаг пропускаем"
          fi

      - name: Test
        run: npm test

      - name: Compile (typecheck + build)
        run: npm run compile

      - name: Package extension (vsix)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run package

      - name: Upload vsix artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: codescout-vsix-${{ matrix.os }}
          path: extension/*.vsix
          if-no-files-found: error
