name: CodeScout review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: AI code review
    runs-on: ubuntu-latest
    steps:
      - name: Run CodeScout
        uses: valden2007/CodeScout@main
        with:
          provider: groq
          model: llama-3.3-70b-versatile
          api-key: ${{ secrets.GROQ_API_KEY }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
